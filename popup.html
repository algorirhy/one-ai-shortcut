<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Shortcut for AI Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    html,
    body {
      width: 360px;
      min-width: 360px;
      max-width: 360px;
      overflow-x: hidden;
    }

    body {
      max-height: 600px;
      overflow-y: auto;
      background: #15182b;
      color: #e5e7eb;
    }

    button, textarea, input { font: inherit; }

    .header {
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #191c33 0%, #15223c 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header h1 {
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0.3px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      margin-top: 4px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }

    .composer {
      padding: 12px 14px;
    }

    .prompt-label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 650;
    }

    #prompt-input {
      display: block;
      width: 100%;
      height: 82px;
      min-height: 82px;
      max-height: 140px;
      padding: 9px 10px;
      resize: none;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 10px;
      outline: none;
      background: #0f1324;
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.5;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #prompt-input::placeholder { color: #64748b; }

    #prompt-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16);
    }

    .selection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 11px 2px 6px;
    }

    .selection-count {
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 650;
    }

    #toggle-all {
      border: 0;
      background: transparent;
      color: #8b9cff;
      cursor: pointer;
      font-size: 11px;
    }

    #toggle-all:hover { color: #a5b4fc; }

    .site-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .site-option {
      display: flex;
      align-items: center;
      min-height: 34px;
      padding: 5px 8px;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .site-option:hover { background: rgba(255, 255, 255, 0.04); }

    .site-option:has(input:checked) {
      background: rgba(99, 102, 241, 0.08);
      border-color: rgba(129, 140, 248, 0.12);
    }

    .site-option input {
      width: 15px;
      height: 15px;
      margin-right: 10px;
      accent-color: #818cf8;
      cursor: pointer;
    }

    .site-dot {
      width: 8px;
      height: 8px;
      margin-right: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .site-name {
      flex: 1;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
    }

    .site-url {
      color: #64748b;
      font-size: 10px;
    }

    #send-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 40px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #4f8bea);
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    #send-button:hover:not(:disabled) { filter: brightness(1.08); }

    #send-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    #send-button.busy .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status {
      display: none;
      margin-top: 8px;
      padding: 8px 9px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    #status.visible { display: block; }
    #status.success { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; }
    #status.warning { background: rgba(245, 158, 11, 0.1); color: #fcd34d; }
    #status.error { background: rgba(244, 63, 94, 0.1); color: #fda4af; }

    .footer {
      padding: 8px 12px 9px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: #64748b;
      text-align: center;
      font-size: 10px;
      line-height: 1.5;
    }

    .footer a { color: #818cf8; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
    kbd { font-family: inherit; color: #94a3b8; }
  </style>
</head>
<body>
  <header class="header">
    <h1>One Shortcut for AI Chat</h1>
    <p>Start the same new conversation across your selected AI assistants.</p>
  </header>

  <main class="composer">
    <form id="prompt-form">
      <label class="prompt-label" for="prompt-input">Message</label>
      <textarea
        id="prompt-input"
        placeholder="Type a message to send..."
        aria-describedby="send-hint"
        autofocus
      ></textarea>

      <div class="selection-header">
        <span class="selection-count" id="selection-count">6 selected</span>
        <button type="button" id="toggle-all">Deselect all</button>
      </div>

      <div class="site-list" id="site-list"></div>

      <button type="submit" id="send-button" disabled>
        <span class="spinner" aria-hidden="true"></span>
        <span id="send-button-text">Send to 6 assistants</span>
      </button>
      <p id="send-hint" class="footer-hint" hidden>Press Command or Control plus Enter to send.</p>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer class="footer">
    <kbd>⇧⌘O</kbd> new chat · <a href="#" id="shortcut-link">Customize shortcut</a>
  </footer>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
